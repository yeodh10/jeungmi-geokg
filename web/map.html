<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증미역 공간 지식 그래프</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/common.js"></script>
<style>
  .wrap { display: grid; grid-template-columns: 380px 1fr; height: calc(100% - 52px); }
  .side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; min-width: 0; }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sec h3 { margin: 0 0 8px; }
  .row { display: flex; gap: 6px; }
  .row .btn { flex: none; white-space: nowrap; }
  .mapbox { position: relative; min-height: 300px; min-width: 0; }
  #map { position: absolute; inset: 0; }
  .loadbox { position: absolute; top: 10px; left: 10px; z-index: 2; max-width: calc(100% - 70px); display: flex; flex-direction: column; gap: 6px; }
  .loadbox .banner { box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
  .loadbox .banner.wait { background: var(--panel); }
  .area-tag { background: rgba(255, 255, 255, .92); border: 1px solid #98a2b3; border-radius: 4px; padding: 0 6px; font-size: 12px; color: #344054; white-space: nowrap; pointer-events: none; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.mini { padding: 2px 10px; font-size: 12px; font-weight: 600; }
  .loadbox .btn.mini { margin-left: 8px; }
  .layer { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .layer .n { margin-left: auto; color: var(--muted); font-size: 12px; }
  .layer .btn.mini { margin-left: 6px; }
  .status-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin: 4px 0 0 22px; font-size: 12px; color: var(--muted); }
  .status-legend .st { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .status-legend .st input { margin: 0; }
  .status-legend .st .n { margin-left: auto; }
  .status-legend .st.zero { opacity: .45; cursor: not-allowed; }
  .status-legend span.st { cursor: help; padding-left: 18px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 6px 22px; }
  .sw.retired { box-shadow: inset 0 0 0 2px #7a1a12; }
  .sw.answer { background: rgba(122, 90, 248, .2); box-shadow: inset 0 0 0 2px var(--answer); }
  .sw.area { background: transparent; border: 1.5px dashed #344054; }
  #hits ul { list-style: none; margin: 4px 0 0; padding: 0; }
  button.hit { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 5px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  button.hit:hover, button.hit.on { background: var(--soft); }
  button.hit.on { box-shadow: inset 2px 0 0 var(--accent); }
  button.hit .sub { display: block; }
  .chip.kind { font-weight: 600; font-size: 11px; padding: 0 6px; }
  .chip.k-station { background: #fdf3d6; color: #6f5200; }
  .chip.k-facility { background: #f0ebfc; color: #5531b8; }
  .chip.k-building { background: var(--soft); color: var(--text); }
  .chip.k-entrance { background: var(--accent-soft); color: var(--accent); }
  .info h2 { margin-top: 8px; }
  .info h2:focus { outline: none; }
  .links a { display: inline-block; margin: 0 8px 2px 0; }
  .navlinks { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; margin-bottom: 6px; }
  .pub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-size: 12px; }
  ul.hist { list-style: none; margin: 0; padding: 0; }
  ul.hist li { padding: 6px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .tablewrap { overflow-x: auto; margin-top: 6px; }
  .answer-yn { margin-top: 8px; padding: 10px 12px; font-size: 18px; font-weight: 700; border: 3px solid var(--answer); border-radius: var(--radius); }
  /* 좁은 화면: 지도를 위에, 목록과 정보를 그 아래에 이어서 둔다 */
  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    .mapbox { order: 1; }
    .side { order: 2; overflow: visible; border-right: 0; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">증미역 공간 지식 그래프<small>반경 1km, GeoSPARQL 1.1</small></div>
  <nav><a href="/map" class="on">지도</a><a href="/">변경 제안 검토<span class="count" id="pending-count" style="display:none"></span></a></nav>
</header>
<div class="wrap">
  <aside class="side">
    <div class="sec">
      <h3>찾기</h3>
      <input id="q" class="field" autocomplete="off" aria-label="건물 이름이나 도로명주소로 찾기" placeholder="건물 이름이나 도로명주소 (예: 양천로 550)">
      <div id="hits" aria-live="polite"></div>
    </div>
    <div class="sec">
      <h3>질문하기</h3>
      <form id="askf" class="row"><input id="ask" class="field" aria-label="그래프에 물어볼 질문" placeholder="예: 증미역 300m 안 학교"><button class="btn" id="askb">묻기</button></form>
      <div class="small muted" style="margin-top:4px">질문을 SPARQL로 바꿔 그래프에 묻습니다 (Claude API 필요).</div>
    </div>
    <div class="sec" id="layers">
      <h3>레이어</h3>
      <label class="layer"><input type="checkbox" data-l="building"><i class="sw" style="background:var(--active)"></i>건물<span class="n" id="n-building"></span></label>
      <div class="status-legend" id="st-legend"></div>
      <div class="quick">
        <button type="button" class="btn ghost mini" id="only-retired" disabled>폐지만 보기</button>
        <button type="button" class="btn ghost mini" id="all-status" disabled>모든 상태</button>
      </div>
      <label class="layer"><input type="checkbox" data-l="entrance"><i class="sw dot" style="background:var(--accent)"></i>출입구<span class="n" id="n-entrance"></span></label>
      <label class="layer"><input type="checkbox" data-l="facility"><i class="sw dot" style="background:var(--facility)"></i>공공시설<span class="n" id="n-facility"></span></label>
      <label class="layer"><input type="checkbox" data-l="station"><i class="sw dot" style="background:var(--station)"></i>역<span class="n" id="n-station"></span></label>
      <label class="layer" title="도로명주소 전자지도의 도로구간. 출입구는 같은 도로명의 가장 가까운 구간에 이어져 있다"><input type="checkbox" data-l="road"><i class="sw" style="background:var(--road);height:3px"></i>도로 구간<span class="n" id="n-road"></span></label>
      <label class="layer" title="국토지리정보원 국가기본도의 건물 외곽 (증미역 둘레 약 600m만 받음). 우리 건물과 모양이 1:1로 겹치면 서로 이어져 있다"><input type="checkbox" data-l="basemap"><i class="sw area" style="border-color:var(--basemap)"></i>국가기본도 건물<span class="n" id="n-basemap"></span></label>
      <label class="layer" title="국토지리정보원 수치지형도 Ver2.0(1:5,000, 도엽 37608075)의 건물 외곽"><input type="checkbox" data-l="digitalmap"><i class="sw area" style="border-color:var(--digitalmap)"></i>수치지형도 건물<span class="n" id="n-digitalmap"></span></label>
      <label class="layer" title="도로명주소 전자지도의 법정동 경계"><input type="checkbox" data-l="legaldong"><i class="sw area" style="border-color:var(--legaldong)"></i>법정동 경계<span class="n" id="n-legaldong"></span></label>
      <label class="layer" title="config/area.yaml의 중심과 반지름으로 그린 원"><input type="checkbox" data-l="area"><i class="sw area"></i>범위 1km</label>
      <label class="layer"><input type="checkbox" data-l="osm"><i class="sw" style="background:#d9dde3"></i>배경지도 (OpenStreetMap)</label>
      <div class="layer"><i class="sw answer" style="margin-left:21px"></i>질문 답<span class="n" id="n-answer"></span><button type="button" class="btn ghost mini" id="clear-answer" disabled>답 지우기</button></div>
    </div>
    <div class="sec">
      <h3>행정동</h3>
      <label for="dong" class="sr-only">행정동 고르기</label>
      <select id="dong" class="field" disabled><option value="">전체 (강조 안 함)</option></select>
      <div class="small muted" id="dong-note" style="margin-top:4px">건물을 받으면 고를 수 있습니다.</div>
    </div>
    <div class="sec info" id="info" aria-live="polite"><div class="muted">지도에서 객체를 누르거나 찾기로 고르면 그래프에 담긴 내용이 여기에 나옵니다.</div></div>
  </aside>
  <div class="mapbox"><div id="map"></div><div class="loadbox" id="loadbox"></div></div>
</div>
<script>
const data = {};  // 레이어 이름 -> 서버에서 받은 FeatureCollection (받은 것만)
const KEY_ORDER = ["roadAddress", "useName", "structureName", "floorsAbove", "floorsBelow", "approvalDate", "lineName",
  "facilityType", "agencyName", "agencyCode", "entranceType", "subEntranceSeq", "buildingMgtNo", "gisBuildingId", "pnu",
  "admDongCode", "siteArea", "totalFloorArea", "households", "mainBuildingCount", "complexMainUse", "retiredOn",
  "roadCode", "roadSegmentNo", "roadClass", "roadWidth", "roadLength", "legalDongCode", "basicZoneNo",
  "basemapId", "molitUfid", "ufid", "sheetCode", "mapKind", "mapUse", "mapKindCode", "mapUseCode", "mapFloors",
  "matchIoU", "pnuAgrees", "addressAgrees", "noticeNumber", "zoneKind"];
const LINKS = ["within", "inLegalDong", "inBasicZone", "locatedOn", "addressRoad", "housedIn", "hasEntrance", "facesRoad",
  "segmentOf", "basemapFeature", "digitalMapFeature", "zoneDesignatedBy", "zoneReleasedBy", "planApprovedBy", "completedBy",
  "sameAs", "wasInfluencedBy"];
// 변경 제안 노드를 열 때 더 보이는 속성과, 어휘 이름표가 길어서 줄여 쓰는 이름
const PROPOSAL_KEYS = ["description", "proposalAction", "sourceKind", "created", "decidedBy", "decidedAt"];
const KEY_LABEL = { proposalAction: "제안 종류", sourceKind: "제안 출처" };
const YES_NO = v => v === "true" ? "예" : v === "false" ? "아니요" : v;
const KEY_VALUE = { proposalAction: v => ACTION[v] || v, sourceKind: v => SOURCE[v] || v, pnuAgrees: YES_NO, addressAgrees: YES_NO };
const station = BASE + "station/1150010200106660040000001";

const KINDS = ["building", "entrance", "facility", "station", "road", "legaldong", "basemap", "digitalmap"];
const KIND_KO = { building: "건물", entrance: "출입구", facility: "공공시설", station: "역", road: "도로 구간", legaldong: "법정동", basemap: "국가기본도 건물", digitalmap: "수치지형도 건물", area: "범위 원" };
const KIND_RANK = { station: 0, facility: 1, building: 2, legaldong: 3, road: 4, basemap: 5, digitalmap: 6, entrance: 7 };  // 찾기에서 점수가 같을 때 앞에 둘 순서
const STATUSES = [
  { name: "사용", color: "--active", tip: "사용: 도로명주소 건물관리번호가 있는, 지금 쓰이는 건물" },
  { name: "주소 미연결", color: "--unlinked", tip: "주소 미연결: 도로명주소에 없는 GIS 건물" },
  { name: "주소 연결됨", color: "--linked", tip: "주소 연결됨: 주소 미연결이던 GIS 건물을 승인을 거쳐 도로명주소 건물에 이은 것" },
  { name: "폐지", color: "--retired", tip: "폐지: 없어진 것이 확인된 건물 (URI는 남는다, 굵은 테두리로도 보인다)" },
];
const GEOM_RE = /^(POINT|MULTIPOINT|LINESTRING|MULTILINESTRING|POLYGON|MULTIPOLYGON)/;
// 레이어 목록의 이름 -> 지도 레이어 id
const LAYER_IDS = { building: ["building", "building-pt", "building-retired"], entrance: ["entrance"], facility: ["facility"],
  station: ["station"], road: ["road"], legaldong: ["legaldong-line"], basemap: ["basemap-line"], digitalmap: ["digitalmap-line"], area: ["area-line"], osm: ["osm"] };
// 아래에서 위로 그리는 순서. 늦게 받은 레이어도 beforeId로 이 자리에 끼운다
const ORDER = ["legaldong-line", "road", "building", "building-pt", "building-retired", "digitalmap-line", "basemap-line", "area-line", "entrance", "facility", "station",
  "sel-line", "sel-pt", "answer-fill", "answer-line", "answer-pt"];
const CLICKABLE = ["station", "facility", "entrance", "building-pt", "building", "road", "answer-pt", "answer-fill"];
const $ = id => document.getElementById(id);
const narrow = () => matchMedia("(max-width: 860px)").matches;
const emptyFC = () => ({ type: "FeatureCollection", features: [] });
const josa = w => { const c = String(w).charCodeAt(String(w).length - 1) - 0xAC00; return c >= 0 && c < 11172 && c % 28 ? "을" : "를"; };

// 주소창 쿼리에서 처음 상태를 읽는다: focus, z, c, st(보이는 상태), dong, off(꺼 둔 레이어)
const qs = new URLSearchParams(location.search);
const list = v => (v || "").split(",").map(s => s.trim()).filter(Boolean);
let st = new Set(qs.has("st") ? list(qs.get("st")).filter(s => STATUSES.some(x => x.name === s)) : STATUSES.map(x => x.name));
const DEFAULT_OFF = "entrance,legaldong,basemap,digitalmap";  // 처음에 꺼 둘 레이어
const off = new Set(qs.has("off") ? list(qs.get("off")).filter(k => k in LAYER_IDS) : DEFAULT_OFF.split(","));
let dongSel = qs.get("dong") || "";
const zc = (() => {
  const z = parseFloat(qs.get("z")), c = list(qs.get("c")).map(Number);
  return isFinite(z) && c.length === 2 && c.every(isFinite) ? { zoom: z, center: c } : null;
})();
const focus0 = qs.get("focus");
let initialFit = !zc && !focus0;  // 범위 원을 받으면 그 bbox로 처음 화면을 맞출지

let current = null;     // 정보 패널에 보이는 객체 URI
let focusParam = null;  // 주소창 focus에 쓸 URI (처음 기본 증미역은 쓰지 않는다)
let panel = "feature";  // 정보 패널에 지금 보이는 것: feature | answer
let lastAnswer = null;  // 마지막 질문 결과 (돌아가기용)
let showSeq = 0;        // 정보 패널 요청 번호. 마지막 요청의 응답만 그린다
let areaTag = null;

const map = new maplibregl.Map({ container: "map", style: baseStyle(), center: zc ? zc.center : [126.86125, 37.55772],
  zoom: zc ? zc.zoom : 15, attributionControl: { compact: true } });
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");
const styleReady = new Promise(res => whenStyleReady(map, res));

function urlNow(focus = focusParam) {
  const p = new URLSearchParams();
  if (focus) p.set("focus", focus);
  const c = map.getCenter();
  p.set("z", map.getZoom().toFixed(2));
  p.set("c", c.lng.toFixed(5) + "," + c.lat.toFixed(5));
  if (st.size !== STATUSES.length) p.set("st", STATUSES.map(x => x.name).filter(s => st.has(s)).join(","));
  if (dongSel) p.set("dong", dongSel);
  const offList = Object.keys(LAYER_IDS).filter(k => off.has(k)).join(",");
  if (offList !== DEFAULT_OFF) p.set("off", offList);  // 기본(출입구, 법정동, 국가기본도, 수치지형도 끔)이면 적지 않는다
  return "/map?" + p.toString();
}
const saveQuery = () => history.replaceState(history.state, "", urlNow());

// 늦게 받은 레이어도 ORDER 순서 자리에 넣는다
function addLayerAt(spec) {
  const before = ORDER.slice(ORDER.indexOf(spec.id) + 1).find(id => map.getLayer(id));
  map.addLayer(spec, before);
  if (CLICKABLE.includes(spec.id)) {
    map.on("mouseenter", spec.id, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", spec.id, () => map.getCanvas().style.cursor = "");
  }
}

const isRetired = ["==", ["get", "status"], "폐지"];
function buildingFilter(kind) {
  const geom = kind === "pt" ? ["==", ["geometry-type"], "Point"] : ["!=", ["geometry-type"], "Point"];
  const f = ["all", geom, ["in", ["get", "status"], ["literal", [...st]]]];
  return kind === "retired" ? [...f, isRetired] : f;
}

function layerSpecs(k) {
  const statusColor = ["match", ["get", "status"], "주소 미연결", css("--unlinked"), "주소 연결됨", css("--linked"), "폐지", css("--retired"), css("--active")];
  if (k === "building") return [
    { id: "building", type: "fill", source: "building", filter: buildingFilter("fill"),
      paint: { "fill-color": statusColor, "fill-opacity": 0.7, "fill-outline-color": "#4b5565" } },
    { id: "building-pt", type: "circle", source: "building", filter: buildingFilter("pt"),
      paint: { "circle-radius": 3.5, "circle-color": statusColor, "circle-stroke-width": ["case", isRetired, 2.5, 1],
               "circle-stroke-color": ["case", isRetired, "#7a1a12", "#fff"] } },
    // 폐지는 색만으로 가리기 어려워서 굵은 테두리를 따로 그린다
    { id: "building-retired", type: "line", source: "building", filter: buildingFilter("retired"),
      paint: { "line-color": "#7a1a12", "line-width": 2.5 } },
  ];
  if (k === "entrance") return [{ id: "entrance", type: "circle", source: "entrance", paint: { "circle-radius": 2.5, "circle-color": css("--accent") } }];
  if (k === "road") return [{ id: "road", type: "line", source: "road",
    paint: { "line-color": css("--road"), "line-width": ["interpolate", ["linear"], ["zoom"], 14, 1.5, 18, 4], "line-opacity": 0.85 } }];
  if (k === "basemap") return [{ id: "basemap-line", type: "line", source: "basemap",
    paint: { "line-color": css("--basemap"), "line-width": 1.6 } }];
  if (k === "digitalmap") return [{ id: "digitalmap-line", type: "line", source: "digitalmap",
    paint: { "line-color": css("--digitalmap"), "line-width": 1.2, "line-dasharray": [2, 1] } }];
  if (k === "legaldong") return [{ id: "legaldong-line", type: "line", source: "legaldong",
    paint: { "line-color": css("--legaldong"), "line-width": 2, "line-dasharray": [4, 2] } }];
  if (k === "facility") return [{ id: "facility", type: "circle", source: "facility",
    paint: { "circle-radius": 6, "circle-color": css("--facility"), "circle-stroke-width": 2, "circle-stroke-color": "#fff" } }];
  return [{ id: "station", type: "circle", source: "station",
    paint: { "circle-radius": 9, "circle-color": css("--station"), "circle-stroke-width": 3, "circle-stroke-color": "#fff" } }];
}

styleReady.then(() => {
  map.addSource("sel", { type: "geojson", data: emptyFC() });
  addLayerAt({ id: "sel-line", type: "line", source: "sel", paint: { "line-color": css("--select"), "line-width": 3 } });
  addLayerAt({ id: "sel-pt", type: "circle", source: "sel", filter: ["==", ["geometry-type"], "Point"],
               paint: { "circle-radius": 11, "circle-color": "rgba(0,0,0,0)", "circle-stroke-width": 3, "circle-stroke-color": css("--select") } });
  map.addSource("answer", { type: "geojson", data: emptyFC() });
  addLayerAt({ id: "answer-fill", type: "fill", source: "answer", filter: ["!=", ["geometry-type"], "Point"],
               paint: { "fill-color": css("--answer"), "fill-opacity": 0.25 } });
  addLayerAt({ id: "answer-line", type: "line", source: "answer", filter: ["!=", ["geometry-type"], "Point"],
               paint: { "line-color": css("--answer"), "line-width": 3.5 } });
  addLayerAt({ id: "answer-pt", type: "circle", source: "answer", filter: ["==", ["geometry-type"], "Point"],
               paint: { "circle-radius": 9, "circle-color": "rgba(122,90,248,0.25)", "circle-stroke-width": 3.5, "circle-stroke-color": css("--answer") } });
  applyVis("osm");
  map.on("click", e => {  // 겹친 객체는 위에 그린 것(답, 역, 공공시설, 출입구, 건물 순)을 고른다
    const layers = CLICKABLE.filter(id => map.getLayer(id));
    const hit = map.queryRenderedFeatures(e.point, { layers }).find(f => f.properties.uri);
    if (hit) show(hit.properties.uri, { push: true });
  });
  map.on("moveend", saveQuery);
});

// 자료 받기: 레이어마다 따로 받아서 받는 대로 그린다. 실패하면 지도 위에 '다시 시도'를 띄운다
const load = {};  // 이름 -> { state: loading | ok | error, msg, promise }
function renderLoad() {
  const busy = Object.keys(load).filter(k => load[k].state === "loading");
  const bad = Object.keys(load).filter(k => load[k].state === "error");
  const box = $("loadbox");
  box.innerHTML = (busy.length ? `<div class="banner wait small">${busy.map(k => KIND_KO[k]).join(", ")} 받는 중...</div>` : "")
    + bad.map(k => `<div class="banner no" role="alert">${esc(KIND_KO[k])}${josa(KIND_KO[k])} 받지 못했습니다: ${esc(load[k].msg)}`
      + `<button type="button" class="btn mini" data-retry="${k}">다시 시도</button></div>`).join("");
  box.querySelectorAll("[data-retry]").forEach(b => b.onclick = () => (b.dataset.retry === "area" ? loadArea() : loadKind(b.dataset.retry)));
}

function loadKind(k) {
  if (load[k] && load[k].state !== "error") return load[k].promise;
  const item = load[k] = { state: "loading" };
  item.promise = (async () => {
    try {
      const fc = await fetchJSON("/api/layers/" + k);
      await styleReady;
      data[k] = fc;
      if (map.getSource(k)) map.getSource(k).setData(fc);
      else { map.addSource(k, { type: "geojson", data: fc }); layerSpecs(k).forEach(addLayerAt); }
      $("n-" + k).textContent = fc.features.length.toLocaleString() + "개";
      applyVis(k);
      if (k === "building") { renderStatus(); renderDongs(); applyDong(); }
      item.state = "ok";
    } catch (e) {
      item.state = "error"; item.msg = e.message;
    }
    renderLoad(); refreshHits();
  })();
  renderLoad();
  return item.promise;
}

function loadArea() {
  const item = load.area = { state: "loading" };
  item.promise = (async () => {
    try {
      const a = await fetchJSON("/api/area");
      await styleReady;
      if (map.getSource("area")) map.getSource("area").setData(a);
      else {
        map.addSource("area", { type: "geojson", data: a });
        addLayerAt({ id: "area-line", type: "line", source: "area", paint: { "line-color": "#344054", "line-width": 1.6, "line-dasharray": [3, 2] } });
      }
      const b = a.bbox ? new maplibregl.LngLatBounds([a.bbox[0], a.bbox[1]], [a.bbox[2], a.bbox[3]]) : boundsOf(a.features);
      // 글자 레이어(symbol)는 글꼴 파일이 있어야 해서, 원 꼭대기에 작은 글 상자를 붙인다
      const el = document.createElement("div");
      el.className = "area-tag";
      el.textContent = (a.features && a.features[0] && a.features[0].properties.label) || "증미역 반경 1km";
      if (areaTag) areaTag.remove();
      areaTag = new maplibregl.Marker({ element: el, anchor: "bottom" }).setLngLat([a.center ? a.center[0] : b.getCenter().lng, b.getNorth()]).addTo(map);
      applyVis("area");
      if (initialFit) map.fitBounds(b, { padding: 24, duration: 0 });
      item.state = "ok";
    } catch (e) {
      item.state = "error"; item.msg = e.message;
    }
    initialFit = false;
    renderLoad();
  })();
  renderLoad();
  return item.promise;
}

// 레이어 켜고 끄기: 그 레이어가 아직 없으면 상태만 기억했다가 생길 때 applyVis로 적용한다
function applyVis(name) {
  const v = off.has(name) ? "none" : "visible";
  for (const id of LAYER_IDS[name] || []) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", v);
  if (name === "area" && areaTag) areaTag.getElement().style.display = off.has("area") ? "none" : "";
}
document.querySelectorAll("#layers input[data-l]").forEach(cb => {
  const l = cb.dataset.l;
  cb.checked = !off.has(l);
  cb.onchange = () => {
    if (cb.checked) off.delete(l); else off.add(l);
    if (KINDS.includes(l) && cb.checked) loadKind(l);  // 꺼 둔 레이어는 처음 켤 때 받는다
    applyVis(l);
    saveQuery();
  };
});

// 건물 상태 고르기: 범례 줄이 체크상자다
function renderStatus() {
  const feats = data.building ? data.building.features : null;
  const cnt = {};
  for (const f of feats || []) cnt[f.properties.status] = (cnt[f.properties.status] || 0) + 1;
  const pts = feats ? feats.filter(f => f.geometry && f.geometry.type === "Point").length : null;
  $("st-legend").innerHTML = STATUSES.map(s => {
    const n = feats ? cnt[s.name] || 0 : null;
    const zero = n === 0;
    return `<label class="st${zero ? " zero" : ""}" title="${esc(s.tip + (zero ? " (0개라 끌 수 없음)" : ""))}">`
      + `<input type="checkbox" data-st="${esc(s.name)}"${st.has(s.name) ? " checked" : ""}${zero || !feats ? " disabled" : ""}>`
      + `<i class="sw${s.name === "폐지" ? " retired" : ""}" style="background:var(${s.color})"></i>${esc(s.name)}`
      + `<span class="n">${n === null ? "" : n.toLocaleString()}</span></label>`;
  }).join("") + `<span class="st" title="점: 모양 없이 위치만 있는 건물"><i class="sw dot" style="background:var(--active)"></i>점 건물`
    + `<span class="n">${pts === null ? "" : pts.toLocaleString()}</span></span>`;
  $("st-legend").querySelectorAll("input[data-st]").forEach(cb => cb.onchange = () => {
    if (cb.checked) st.add(cb.dataset.st); else st.delete(cb.dataset.st);
    applyFilter(); saveQuery();
  });
  $("only-retired").disabled = !cnt["폐지"];
  $("all-status").disabled = !feats;
}
function setStatuses(names) {
  st = new Set(names);
  renderStatus(); applyFilter(); saveQuery();
}
function applyFilter() {
  if (!map.getLayer("building")) return;
  map.setFilter("building", buildingFilter("fill"));
  map.setFilter("building-pt", buildingFilter("pt"));
  map.setFilter("building-retired", buildingFilter("retired"));
}
$("only-retired").onclick = () => {
  setStatuses(["폐지"]);
  const fs = data.building.features.filter(f => f.properties.status === "폐지");
  if (off.has("building")) { off.delete("building"); document.querySelector('[data-l="building"]').checked = true; applyVis("building"); }
  if (fs.length) map.fitBounds(boundsOf(fs), { padding: 60, maxZoom: 18, duration: 500 });
};
$("all-status").onclick = () => setStatuses(STATUSES.map(x => x.name));

// 행정동 고르기: 레이어 properties.dong(jgk:within으로 이어진 행정동 이름) 기준
const dongFeatures = name => (data.building ? data.building.features : [])
  .filter(f => name === "none" ? !f.properties.dong : f.properties.dong === name);
function renderDongs() {
  const feats = data.building.features, sel = $("dong");
  if (!feats.some(f => "dong" in f.properties)) {
    $("dong-note").textContent = "서버가 아직 건물의 행정동을 주지 않습니다.";
    dongSel = "";
    return;
  }
  const n = {};
  let none = 0;
  for (const f of feats) { const d = f.properties.dong; if (d) n[d] = (n[d] || 0) + 1; else none++; }
  sel.innerHTML = '<option value="">전체 (강조 안 함)</option>'
    + Object.keys(n).sort((a, b) => a.localeCompare(b, "ko")).map(d => `<option value="${esc(d)}">${esc(d)} 건물 ${n[d].toLocaleString()}개</option>`).join("")
    + (none ? `<option value="none">행정동 미연결 ${none.toLocaleString()}</option>` : "");
  sel.disabled = false;
  if (dongSel && ![...sel.options].some(o => o.value === dongSel)) dongSel = "";
  sel.value = dongSel;
  $("dong-note").textContent = "고른 동의 건물을 진하게 칠합니다. 경계가 아니라 소속 관계(jgk:within)로 칠한 것입니다.";
}
function applyDong() {
  if (!map.getLayer("building")) return;
  const c = !dongSel ? null : dongSel === "none" ? ["==", ["coalesce", ["get", "dong"], ""], ""] : ["==", ["get", "dong"], dongSel];
  map.setPaintProperty("building", "fill-opacity", c ? ["case", c, 0.85, 0.12] : 0.7);
  map.setPaintProperty("building-pt", "circle-opacity", c ? ["case", c, 1, 0.2] : 1);
  map.setPaintProperty("building-pt", "circle-stroke-opacity", c ? ["case", c, 1, 0.2] : 1);
  map.setPaintProperty("building-retired", "line-opacity", c ? ["case", c, 1, 0.3] : 1);
}
function selectDong(name, fit = true) {
  dongSel = name || "";
  if ([...$("dong").options].some(o => o.value === dongSel)) $("dong").value = dongSel;
  applyDong(); saveQuery();
  const fs = dongSel ? dongFeatures(dongSel) : [];
  if (fit && fs.length) { initialFit = false; map.fitBounds(boundsOf(fs), { padding: 40, maxZoom: 17, duration: 500 }); }
}
$("dong").onchange = e => selectDong(e.target.value);

function featureOf(uri) {
  for (const k in data) { const f = data[k].features.find(x => x.properties.uri === uri); if (f) return f; }
  return null;
}

function link(names, u, fallback) {
  const n = names[u] || {};
  return `<a href="#" data-u="${esc(u)}">${esc(n.label || fallback || u.replace(BASE, ""))}</a>`;
}

// 정보 패널 위의 이동 링크: 앞 객체로(브라우저 뒤로), 질문 결과로 돌아가기
function topLinks() {
  const a = [];
  if (history.state && history.state.prev) a.push('<a href="#" id="go-prev">← 앞 객체로</a>');
  if (lastAnswer) a.push('<a href="#" id="go-answer">질문 결과로 돌아가기</a>');
  return a.length ? `<div class="navlinks">${a.join("")}</div>` : "";
}
function bindInfo() {
  const info = $("info");
  info.querySelectorAll("a[data-u]").forEach(a => a.onclick = ev => { ev.preventDefault(); show(a.dataset.u, { push: true, focus: true }); });
  const prev = $("go-prev");
  if (prev) prev.onclick = ev => { ev.preventDefault(); history.back(); };
  const back = $("go-answer");
  if (back) back.onclick = ev => { ev.preventDefault(); renderAnswer(lastAnswer, true); };
  const cur = $("go-current");
  if (cur) cur.onclick = ev => { ev.preventDefault(); show(current, { quiet: true, intro: !focusParam, focus: true }); };
  const copy = $("copy-uri");
  if (copy) copy.onclick = () => {
    const done = t => { copy.textContent = t; setTimeout(() => copy.textContent = "URI 복사", 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(copy.dataset.u).then(() => done("복사했습니다"), () => done("복사하지 못했습니다"));
    else done("복사하지 못했습니다");
  };
}
function afterRender(opts = {}) {
  bindInfo();
  const h2 = document.querySelector("#info h2");
  if (opts.focus && h2) h2.focus({ preventScroll: narrow() });
  if (narrow() && !opts.intro) $("info").scrollIntoView({ behavior: "smooth", block: "start" });
}

// 객체 하나를 정보 패널에 보이고 지도에 표시한다
//   opts.push: 주소창 기록을 하나 더한다(링크를 따라갈 때), opts.pop: 뒤로/앞으로에서 부름
//   opts.quiet: 지도를 옮기지 않는다, opts.intro: 처음 기본 화면, opts.focus: 제목으로 포커스를 옮긴다
//   opts.group: 함께 표시하고 맞출 객체 목록 (찾기에서 묶인 건물)
async function show(uri, opts = {}) {
  const my = ++showSeq;
  const info = $("info");
  let f;
  try {
    f = await fetchJSON("/api/feature?uri=" + encodeURIComponent(uri));
  } catch (e) {
    if (my !== showSeq) return;
    panel = "feature";
    info.innerHTML = topLinks() + `<div class="banner no" role="alert">${esc(e.message)}</div><div class="uri" style="margin-top:6px">${esc(uri)}</div>`;
    afterRender(opts);
    return;
  }
  if (my !== showSeq) return;
  // 지도에 그릴 모양: 레이어에 있으면 그것을, 없으면 서버가 준 기본 모양을 쓴다
  let feat = featureOf(uri) || (f.geometry ? { type: "Feature", geometry: f.geometry, properties: { uri } } : null);
  const pending = KINDS.filter(k => load[k] && load[k].state === "loading");
  if (!feat && pending.length) {  // 아직 받는 중인 레이어에 있을 수 있어서 다 받을 때까지 기다려 본다
    await Promise.all(pending.map(k => load[k].promise));
    if (my !== showSeq) return;
    feat = featureOf(uri);
  }
  if (opts.push && uri !== current) history.pushState({ focus: uri, prev: current }, "", urlNow(uri));
  else if (!opts.pop) history.replaceState(history.state, "", urlNow(opts.intro ? null : uri));
  focusParam = opts.intro ? null : uri;
  current = uri;
  panel = "feature";

  const names = f.names || {};
  const by = {};
  for (const t of f.triples) (by[localName(t.p)] ||= []).push(t);
  const types = (by.type || []).map(t => t.o);
  const isProposal = types.some(t => t.endsWith("#ChangeProposal")) || uri.startsWith(BASE + "proposal/");
  const isDong = types.some(t => t.endsWith("#AdminDong"));
  const me = names[uri] || {};
  const status = (by.status || [])[0];
  const title = me.label || (me.type ? `${me.type} ${uri.replace(BASE, "").split("/").pop()}` : uri.replace(BASE, ""));
  const keys = isProposal ? [...KEY_ORDER, ...PROPOSAL_KEYS] : KEY_ORDER;
  const linkKeys = isProposal ? [...LINKS, "affects"] : LINKS;
  const main = keys.filter(k => by[k]).map(k => `<tr><td class="k">${esc(KEY_LABEL[k] || by[k][0].p_label || ext(by[k][0].p) || k)}</td>`
    + `<td>${by[k].map(t => esc((KEY_VALUE[k] || (v => v))(t.o))).join(", ")}</td></tr>`).join("");
  const links = linkKeys.filter(k => by[k]).map(k => `<tr><td class="k">${esc(by[k][0].p_label || ext(by[k][0].p) || k)}</td><td class="links">${by[k].map(t => link(names, t.o)).join(" ")}</td></tr>`).join("");
  // 들어오는 연결: 서버는 속성마다 앞 30개만 주고 전체 개수는 inbound_counts로 준다
  const inbound = {};
  for (const t of f.inbound || []) (inbound[t.p] ||= []).push(t);
  const counts = f.inbound_counts || {};
  const back = Object.entries(inbound).map(([p, list]) => {
    const shown = list.slice(0, 30), total = Math.max(counts[p] || 0, list.length);
    return `<tr><td class="k">${esc(list[0].p_label || ext(p) || localName(p))} (이 객체를)</td><td class="links">${shown.map(t => link(names, t.s, t.s_label)).join(" ")}`
      + `${total > shown.length ? ` 외 ${(total - shown.length).toLocaleString()}개` : ""}</td></tr>`;
  }).join("");
  const sources = (by.source || []).map(t => esc(t.o_label || t.o)).join("<br>");
  const pub = `<div class="pub">${f.public === true
      ? `<a href="${esc(uri)}" target="_blank" rel="noopener">공개 페이지</a><a href="${esc(uri)}/index.ttl" target="_blank" rel="noopener">Turtle</a>`
      : f.public === false ? '<span class="muted">공개 페이지 없음(공개 보류 중이거나 변경 제안)</span>' : ""}`
    + `<button type="button" class="btn ghost mini" id="copy-uri" data-u="${esc(uri)}">URI 복사</button></div>`;
  const hist = (f.history || []).map(h => `<li><span class="small muted">${esc((h.decided_at || h.created || "").slice(0, 10))}</span>
      <span class="chip ${esc(h.action)}">${esc(ACTION[h.action] || h.action)}</span> ${esc(h.summary)}
      <div class="small muted">${h.decided_by ? `승인 ${esc(h.decided_by)}, ` : ""}<a href="/?id=${encodeURIComponent(h.id)}">검토 화면에서 보기</a></div></li>`).join("");
  const proposalId = isProposal ? uri.slice((BASE + "proposal/").length) : null;
  let mapNote = "";
  if (isDong) {
    const n = dongFeatures(me.label).length;
    mapNote = `<div class="banner wait" style="margin-top:8px">이 동에 속한 건물${data.building ? ` ${n.toLocaleString()}개` : ""}를 진하게 칠했습니다. 행정동 경계가 아니라 소속 관계(jgk:within)로 칠한 것입니다.</div>`;
  } else if (!feat && f.in_graph) {
    mapNote = '<div class="small muted" style="margin-top:6px">지도에 모양이 없는 객체입니다.</div>';
  }
  info.innerHTML = topLinks()
    + (opts.intro ? '<div class="small muted" style="margin-bottom:8px">지도에서 객체를 누르거나 찾기로 고르면 그래프에 담긴 내용이 여기에 나옵니다. 색은 건물 상태, 점선 원은 자료 범위입니다 (원에 걸친 건물까지 넣어 원 밖으로 조금 나옵니다).</div>' : "")
    + `<div><span class="chip type">${esc(me.type || "객체")}</span> ${status ? `<span class="chip ${status.o.endsWith("Retired") ? "retire" : "src"}">${esc(status.o_label || localName(status.o))}</span>` : ""}</div>
    <h2 tabindex="-1">${esc(title)}</h2><div class="uri">${esc(uri)}</div>${pub}
    ${proposalId ? `<div class="small" style="margin-top:4px"><a href="/?id=${encodeURIComponent(proposalId)}">검토 화면에서 이 제안 보기</a></div>` : ""}
    ${f.in_graph ? "" : '<div class="banner no" style="margin-top:8px">그래프에 없는 URI입니다.</div>'}
    ${mapNote}
    ${main ? `<h3>주요 정보</h3><table class="kv">${main}</table>` : ""}
    ${links || back ? `<h3>연결</h3><table class="kv">${links}${back}</table>` : ""}
    ${hist ? `<h3>변경 이력</h3><ul class="hist">${hist}</ul>` : ""}
    ${sources ? `<h3>출처</h3><div class="small">${sources}</div>` : ""}
    <details><summary>모든 트리플 (${f.triples.length.toLocaleString()}개${f.triples_truncated ? ", 앞부분만" : ""})</summary><table class="kv">${f.triples.map(t =>
      `<tr><td class="k">${esc(t.p_label || ext(t.p) || localName(t.p))}</td><td>${esc((t.o_label || t.o).slice(0, 160))}</td></tr>`).join("")}</table></details>`;
  afterRender(opts);

  await styleReady;
  const sel = opts.group || (feat ? [feat] : []);
  map.getSource("sel").setData({ type: "FeatureCollection", features: sel });
  if (isDong) selectDong(me.label, !opts.quiet);
  else if (sel.length && !opts.quiet) { initialFit = false; map.fitBounds(boundsOf(sel), { padding: 120, maxZoom: 18, duration: 500 }); }
}

addEventListener("popstate", () => {
  const f = new URLSearchParams(location.search).get("focus");
  show(f || station, { pop: true, intro: !f, quiet: !f });
});

// 찾기: 앞뒤 공백을 지우고, 공백을 뺀 글로도 비교한다 ('양천로550'도 찾게)
const norm = s => String(s ?? "").trim();
const tight = s => norm(s).replace(/\s+/g, "");
function score(text, q, qt) {
  const t = norm(text), tt = tight(text);
  if (!t) return 0;
  if (t === q || tt === qt) return 3;
  if (t.startsWith(q) || tt.startsWith(qt)) return 2;
  if (t.includes(q) || tt.includes(qt)) return 1;
  return 0;
}
const nameOf = (p, kind) => p.label || (kind === "entrance" ? `${p.addr || "건물 주소 없음"} 출입구${p.type ? ` (${p.type})` : ""}` : p.addr || "");
let hitRows = [], hitSel = -1;
const HIT_MAX = 15;
function refreshHits() {
  const raw = $("q").value, q = norm(raw), qt = tight(raw), box = $("hits");
  hitSel = -1;
  if (qt.length < 2) { box.innerHTML = ""; hitRows = []; return; }
  const groups = new Map();  // 같은 이름, 같은 주소의 건물은 한 줄로 묶는다
  for (const k of KINDS) {
    if (!data[k]) continue;  // 출입구는 레이어를 받은 뒤에만 찾는다
    for (const f of data[k].features) {
      const p = f.properties, kind = p.kind || k;
      const s = Math.max(score(p.label, q, qt), score(p.addr, q, qt));
      if (!s) continue;
      // 같은 이름, 같은 주소의 건물과 같은 도로명의 도로 구간은 한 줄로 묶는다
      const key = kind === "building" ? `building|${p.label || ""}|${p.addr || ""}` : kind === "road" ? `road|${p.label || ""}` : p.uri;
      const g = groups.get(key);
      if (g) { g.feats.push(f); g.score = Math.max(g.score, s); }
      else groups.set(key, { kind, score: s, feats: [f] });
    }
  }
  hitRows = [...groups.values()].sort((a, b) => b.score - a.score || (KIND_RANK[a.kind] ?? 9) - (KIND_RANK[b.kind] ?? 9)
    || nameOf(a.feats[0].properties, a.kind).localeCompare(nameOf(b.feats[0].properties, b.kind), "ko"));
  const busy = KINDS.filter(k => load[k] && load[k].state === "loading").map(k => KIND_KO[k]);
  const total = hitRows.length, shown = hitRows.slice(0, HIT_MAX);
  box.innerHTML = (busy.length ? `<div class="small muted">자료를 받는 중 (${busy.join(", ")})</div>` : "")
    + (total ? `<div class="small muted">${total > HIT_MAX ? `${total.toLocaleString()}개 중 ${HIT_MAX}개` : `${total}개`}</div>`
             : busy.length ? "" : '<div class="small muted" style="padding:6px">찾은 것이 없습니다</div>')
    + (!data.entrance ? '<div class="small muted">출입구는 레이어를 켜면 함께 찾습니다</div>' : "")
    + `<ul>${shown.map((g, i) => {
      const p = g.feats[0].properties, n = g.feats.length;
      const sub = [p.label && p.addr ? p.addr : "", p.status, p.use].filter(Boolean).join(", ");
      return `<li><button type="button" class="hit" id="hit-${i}" data-i="${i}"><span class="chip kind k-${esc(g.kind)}">${esc(KIND_KO[g.kind] || g.kind)}</span>
        <b>${esc(nameOf(p, g.kind))}</b>${n > 1 ? ` <span class="small">건물 ${n}동</span>` : ""}${sub ? `<span class="small muted sub">${esc(sub)}</span>` : ""}</button></li>`;
    }).join("")}</ul>`;
  box.querySelectorAll("button.hit").forEach(b => b.onclick = () => openHit(+b.dataset.i));
}
function openHit(i) {
  const g = hitRows[i];
  if (!g) return;
  show(g.feats[0].properties.uri, { push: true, focus: true, group: g.feats.length > 1 ? g.feats : null });
}
function markHit() {
  document.querySelectorAll("#hits button.hit").forEach((b, i) => b.classList.toggle("on", i === hitSel));
  const b = $("hit-" + hitSel);
  if (b) b.scrollIntoView({ block: "nearest" });
}
$("q").oninput = refreshHits;
$("q").onkeydown = e => {
  const n = Math.min(hitRows.length, HIT_MAX);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!n) return;
    e.preventDefault();
    hitSel = e.key === "ArrowDown" ? (hitSel + 1) % n : hitSel <= 0 ? n - 1 : hitSel - 1;
    markHit();
  } else if (e.key === "Enter" && n) {
    e.preventDefault();
    openHit(Math.max(hitSel, 0));
  }
};

// 질문하기
function drawAnswer(a) {
  const fc = a && a.geojson ? a.geojson : emptyFC();
  map.getSource("answer").setData(fc);
  $("n-answer").textContent = a ? fc.features.length.toLocaleString() + "개" : "";
  $("clear-answer").disabled = !a;
}
function renderAnswer(a, refit) {
  ++showSeq;  // 늦게 온 객체 응답이 답을 덮지 않게 한다
  panel = "answer";
  const fc = a.geojson || emptyFC();
  if (refit && fc.features.length) map.fitBounds(boundsOf(fc.features), { padding: 80, maxZoom: 17, duration: 500 });
  const vars = a.vars || [], rows = a.rows || [];
  const geo = a.geometry_vars || vars.filter(v => rows.some(r => GEOM_RE.test(String(r[vars.indexOf(v)] ?? ""))));
  const cols = vars.filter(v => !geo.includes(v));
  const names = a.names || {};
  const cell = x => {
    if (x == null) return "";
    const s = String(x);
    return s.startsWith(BASE) ? `<a href="#" data-u="${esc(s)}">${esc((names[s] && names[s].label) || s.replace(BASE, ""))}</a>` : esc(s);
  };
  let body;
  if (typeof a.boolean === "boolean") body = `<div class="answer-yn">답: ${a.boolean ? "예" : "아니오"}</div>`;
  else if (!rows.length) body = '<div class="empty">결과가 없습니다</div>';
  else {
    const shown = rows.slice(0, 50);
    const count = a.truncated || rows.length > 50
      ? `결과 ${rows.length.toLocaleString()}행${a.truncated ? "(더 있지만 잘림)" : ""} 중 ${shown.length}행 표시` : `결과 ${rows.length}행`;
    body = `<div class="small muted">${count}${fc.features.length ? `, 지도에 보라색 테두리로 ${fc.features.length.toLocaleString()}개 표시` : ""}</div>
      <div class="tablewrap"><table class="kv"><thead><tr>${cols.map(v => `<th>${esc(v)}</th>`).join("")}</tr></thead>
      <tbody>${shown.map(r => `<tr>${cols.map(v => `<td>${cell(r[vars.indexOf(v)])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  $("info").innerHTML = (current ? '<div class="navlinks"><a href="#" id="go-current">보던 객체로</a></div>' : "")
    + `<h2 tabindex="-1">${esc(a.question || "")}</h2><p>${esc(a.explanation || "")}</p>${body}
    <details><summary>실행한 SPARQL</summary><pre>${esc(a.sparql || "")}</pre></details>`;
  afterRender({ focus: refit });
}
$("askf").onsubmit = async e => {
  e.preventDefault();
  const question = $("ask").value.trim();
  if (!question) return;
  const btn = $("askb"), info = $("info");
  ++showSeq;
  btn.disabled = true;
  btn.textContent = "묻는 중...";
  info.innerHTML = '<div class="banner wait">질문을 SPARQL로 바꾸는 중...</div>';
  try {
    const a = await fetchJSON("/api/ask", { json: { question } });
    await styleReady;
    lastAnswer = a;
    drawAnswer(a);
    renderAnswer(a, true);
  } catch (err) {
    ++showSeq;
    panel = "feature";
    info.innerHTML = topLinks() + `<div class="banner no" role="alert">${esc(err.message)}</div>`;
    afterRender();
  } finally {
    btn.disabled = false;
    btn.textContent = "묻기";
  }
};
$("clear-answer").onclick = () => {
  lastAnswer = null;
  drawAnswer(null);
  if (panel === "answer") show(current || station, { quiet: true, intro: !focusParam });
  else { const g = $("go-answer"); if (g) g.remove(); }
};

// 시작: 역, 공공시설, 건물을 받는 대로 그리고 출입구는 켜 둔 경우에만 받는다
renderStatus();
["station", "facility", "building"].forEach(loadKind);
["entrance", "road", "legaldong", "basemap", "digitalmap"].filter(k => !off.has(k)).forEach(loadKind);
loadArea();
show(focus0 || station, focus0 ? { quiet: !!zc } : { intro: true, quiet: true });
pendingCount();
</script>
