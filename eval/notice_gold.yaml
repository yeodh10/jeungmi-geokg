# 고시공고 추출 평가 정답 (사람이 단 것, 2026-10-29)
# mgt: 강서구청 누리집 고시공고 번호(mgtNo). 원문은 python -m src.eval.collect_notices로 받는다 (커밋하지 않는다)
# is_spatial: 공간 객체(건물, 도로, 주소, 공공시설, 하천, 숲길, 구역)가 생기거나 바뀌거나 없어지는 문서인가.
#             계획 인가, 조합 설립처럼 아직 객체가 바뀌지 않는 문서와 판단이 애매한 문서는 null(재지 않음)로 둔다
# targets: 본문에 적힌 대상(지번, 이름). 모델이 뽑은 대상 가운데 하나가 이 글자를 담고 있으면 맞다 (띄어쓰기 무시)
# change_types: 뽑은 변경 종류가 모두 이 안에 있어야 맞다
# effective_date: 본문에 효력 날짜가 적혀 있을 때만 적는다
# 첨부 파일에만 있는 내용(폐지조서 목록 등)은 본문에 없으므로 정답에 넣지 않는다

