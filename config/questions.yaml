- id: name-apartment
  question: 이름에 '${word}' 글자가 들어간 건물
  source: q19
  slots: {word: 아파트}
  answer: 이름에 '${word}' 글자가 들어간 건물은 {n}동입니다.
  none: 이름에 '${word}' 글자가 들어간 건물은 없습니다.
  columns: {b: 건물, f: 지상 층수}
  map_var: b
  forms:
    - 이름에 ${word} 글자가 들어간 건물
    - 이름에 ${word}가 들어간 건물
    - 건물 이름에 ${word}이 있는 곳
    - ${word}라는 이름이 붙은 건물
  sparql: |
    SELECT DISTINCT ?b ?f WHERE {
      ?b a jgk:Building ; rdfs:label ?l .
      OPTIONAL { ?b jgk:floorsAbove ?f FILTER(?f > 0) }
      FILTER(CONTAINS(STR(?l), "${word}"))
    } ORDER BY ?b

