      ?s a jgk:Business ; jgk:categorySmall "${cat}" ; jgk:inBuilding ?b ; geo:hasDefaultGeometry/geo:asWKT ?w .
      FILTER(geof:sfIntersects(?w, {{NEAR:https://yeodh10.github.io/jeungmi-geokg/id/station/1150010200106660040000001:${dist}}}))
    } ORDER BY ?b ?s

- id: households-1000
  question: 세대수가 ${households}세대 이상인 필지의 건물
  slots: {households: 1000}
  answer: 건축물대장 총괄표제부의 세대수가 ${households}세대 이상인 필지는 {n}곳입니다.
  none: 건축물대장 총괄표제부의 세대수가 ${households}세대 이상인 필지는 없습니다.
  columns: {p: 필지, h: 세대수, b: 건물}
  map_var: b
  count_var: p
  forms:
    - 세대수가 ${households} 이상인 필지의 건물
    - ${households} 이상인 아파트 단지
    - 세대수 ${households} 이상 단지
    - 큰 아파트 단지
  sparql: |
    SELECT ?p ?h ?b WHERE {
      ?p a jgk:Parcel ; jgk:households ?h .
      ?b a jgk:Building ; jgk:locatedOn ?p .
      FILTER(?h >= ${households})
    } ORDER BY DESC(?h) ?p ?b
