# 묻기 탭의 미리 실행한 질문 (명세 3.7절, 9절). src/graph/questions.py가 공개 범위 그래프(public_query_store)에서 실행해
# assets/data/questions.json에 쓴다. 답의 숫자는 손으로 적지 않고 실행 결과로 채운다.
#
# 칸
#   id         고유 이름
#   question   화면에 보이는 질문
#   featured   참이면 대표 질문 (첫 패널과 묻기 탭 위). 8개
#   answer     한 문장 답. {n}은 count_var(없으면 map_var)의 서로 다른 값 수, {변수}는 첫 행의 그 값(장소는 화면 이름)
#   none       빈칸 값을 바꿔 실행한 결과가 0행일 때의 답 (빈칸이 있는 질문만)
#   columns    표에 보일 열 {변수: 쉬운 열 이름}. 순서대로 보인다
#   map_var    지도에 보라색으로 그릴 장소 변수 (건물)
#   count_var  세는 변수가 map_var와 다를 때 (필지를 세고 건물을 그릴 때)
#   source     이 질문을 가져온 곳 (eval/nl_questions.yaml의 문제 번호, 없으면 자체 질문)
#   map_sparql 지도 장소를 따로 고를 때 (표 행이 500을 넘지 않게). 이 쿼리의 map_var 값을 지도에 그린다
#   sparql     실행할 쿼리. 접두어(jgk, geo, geof, rdfs)는 붙여서 실행한다. 거리 조건은 {{NEAR:URI:미터}} 자리표시로 쓰고
#              실행할 때 src.query.nl.fill_near가 원으로 바꾼다. 화면에는 자리표시가 든 이 글을 보여 준다
#   slots      빈칸과 기본값. question, answer, none, sparql, map_sparql의 ${이름}을 이 값으로 채운다.
#              questions.json은 기본값으로 실행한 답이다. 빈칸이 받을 수 있는 값은 src/graph/askforms.py의 domains()가 정한다
#   forms      키 없는 질문(묻기 탭의 입력칸)이 이 질문을 알아보는 다른 말투. ${이름} 자리에는 입력에서 찾은 빈칸 값이 온다.
#              사람이 쓴 쿼리만 실행하므로, 말투만 늘리고 쿼리는 이 파일의 sparql 하나다
# 오류, 0행, 500행 초과는 빌드 실패다 (기본값일 때). 이름 칸은 원천 이름 대신 화면 이름(display_name)을 쓰므로 rdfs:label을 고르지 않는다.

- id: edu-500
  question: 증미역 ${dist}m 안 ${use}
  featured: true
  source: q25
  slots: {dist: 500, use: 교육연구시설}
  answer: 증미역 ${dist}m 안에 용도가 ${use}인 건물이 {n}동 있습니다.
  none: 증미역 ${dist}m 안에는 용도가 ${use}인 건물이 없습니다.
  columns: {b: 건물, use: 용도}
  map_var: b
  forms:
    - 증미역 ${dist} 안 ${use}
    - 증미역에서 ${dist} 안에 있는 ${use} 건물
    - 증미역 ${dist} 이내 ${use} 건물은 몇 동이야
    - 역에서 ${dist} 안쪽 ${use} 건물 보여줘
    - 증미역 반경 ${dist} ${use}
    - 증미역 근처 ${use} 건물
  sparql: |
    SELECT ?b ?use WHERE {
      ?b a jgk:Building ; jgk:useName ?use ; geo:hasDefaultGeometry/geo:asWKT ?w .
      FILTER(?use = "${use}")
      FILTER(geof:sfIntersects(?w, {{NEAR:https://yeodh10.github.io/jeungmi-geokg/id/station/1150010200106660040000001:${dist}}}))
    } ORDER BY ?b

- id: floors-20
  question: 지상 ${floors}층 이상인 건물
  featured: true
  source: q07
  slots: {floors: 20}
  answer: 지상 ${floors}층 이상인 건물은 {n}동입니다.
  none: 지상 ${floors}층 이상인 건물은 없습니다.
  columns: {b: 건물, f: 지상 층수, use: 용도}
  map_var: b
  forms:
    - 지상 ${floors} 이상인 건물
    - ${floors} 이상 건물은 몇 동이야
    - ${floors} 이상 되는 높은 건물 보여줘
    - 층수가 ${floors} 이상인 건물
    - 높은 건물
  sparql: |
    SELECT ?b ?f ?use WHERE {
      ?b a jgk:Building ; jgk:floorsAbove ?f .
      OPTIONAL { ?b jgk:useName ?use }
      FILTER(?f >= ${floors})
    } ORDER BY DESC(?f) ?b

- id: apt-15
  question: ${use}이면서 지상 ${floors}층 이상인 건물
  featured: true
  source: q20
  slots: {use: 공동주택, floors: 15}
  answer: ${use}이면서 지상 ${floors}층 이상인 건물은 {n}동입니다.
  none: ${use}이면서 지상 ${floors}층 이상인 건물은 없습니다.
  columns: {b: 건물, f: 지상 층수}
  map_var: b
  forms:
    - ${use}이면서 지상 ${floors} 이상인 건물
    - ${floors} 이상 ${use}
    - ${use} 가운데 ${floors} 이상인 건물
    - 용도가 ${use}이고 ${floors} 넘는 건물
  sparql: |
    SELECT ?b ?f WHERE {
      ?b a jgk:Building ; jgk:useName "${use}" ; jgk:floorsAbove ?f .
      FILTER(?f >= ${floors})
    } ORDER BY DESC(?f) ?b

- id: entrance-2
  question: 출입구가 ${entrances}개 이상인 건물
  featured: true
  source: q15
  slots: {entrances: 2}
  answer: 출입구가 ${entrances}개 이상인 건물은 {n}동입니다.
  none: 출입구가 ${entrances}개 이상인 건물은 없습니다.
  columns: {b: 건물, k: 출입구 수}
  map_var: b
  forms:
    - 출입구가 ${entrances} 이상인 건물
    - 입구가 ${entrances} 넘는 건물
    - 출입구 ${entrances} 이상 있는 건물은 몇 동이야
    - 출입구가 여러 개인 건물
  sparql: |
    SELECT ?b (COUNT(DISTINCT ?e) AS ?k) WHERE {
      ?b a jgk:Building ; jgk:hasEntrance ?e .
    } GROUP BY ?b HAVING (COUNT(DISTINCT ?e) >= ${entrances}) ORDER BY DESC(?k) ?b

- id: before-1980
  question: ${year}년 이전에 사용승인을 받은 건물
  featured: true
  slots: {year: 1980}
  answer: 사용승인일이 ${year}년 1월 1일보다 이른 건물은 {n}동입니다. 사용승인일 자료는 2018년까지입니다.
  none: 사용승인일이 ${year}년 1월 1일보다 이른 건물은 없습니다. 사용승인일 자료는 2018년까지입니다.
  columns: {b: 건물, d: 사용승인일, use: 용도}
  map_var: b
  forms:
    - ${year} 이전에 사용승인을 받은 건물
    - ${year} 전에 지은 건물
    - 사용승인일이 ${year}보다 이른 건물
    - ${year} 이전 준공 건물은 몇 동이야
    - 오래된 건물
  sparql: |
    SELECT ?b ?d ?use WHERE {
      ?b a jgk:Building ; jgk:approvalDate ?d .
      OPTIONAL { ?b jgk:useName ?use }
      FILTER(?d < "${year}-01-01"^^<http://www.w3.org/2001/XMLSchema#date>)
    } ORDER BY ?d ?b

- id: named-no-address
  question: 도로명주소는 없는데 이름이 있는 건물
  featured: true
  answer: 도로명주소가 없지만 이름이 있는 건물은 {n}동입니다.
  columns: {b: 건물, use: 용도}
  map_var: b
  forms:
    - 도로명주소는 없는데 이름이 있는 건물
    - 이름은 있지만 주소가 없는 건물
    - 주소 없는 이름 있는 건물 보여줘
  sparql: |
    SELECT DISTINCT ?b ?use WHERE {
      ?b a jgk:Building ; jgk:status jgk:AddressUnlinked ; rdfs:label ?l .
      OPTIONAL { ?b jgk:useName ?use }
    } ORDER BY ?b

- id: parcel-3
  question: 건물이 ${buildings}동 이상 들어선 필지
  featured: true
  slots: {buildings: 3}
  answer: 건물이 ${buildings}동 이상 들어선 필지는 {n}곳입니다.
  none: 건물이 ${buildings}동 이상 들어선 필지는 없습니다.
  columns: {p: 필지, k: 건물 수}
  map_var: b
  count_var: p
  forms:
    - 건물이 ${buildings} 이상 들어선 필지
    - 한 필지에 건물이 ${buildings} 넘게 있는 곳
    - 건물 ${buildings} 이상 있는 땅
    - 건물이 여러 동 있는 필지
  # 표는 필지마다 한 행이고(151행), 지도에는 그 필지 위 건물을 모두 그린다 (한 쿼리로 건물마다 행을 만들면 500행을 넘는다)
  sparql: |
    SELECT ?p (COUNT(DISTINCT ?x) AS ?k) WHERE {
      ?x a jgk:Building ; jgk:locatedOn ?p .
    } GROUP BY ?p HAVING (COUNT(DISTINCT ?x) >= ${buildings}) ORDER BY DESC(?k) ?p
  map_sparql: |
    SELECT DISTINCT ?b WHERE {
      { SELECT ?p WHERE { ?x a jgk:Building ; jgk:locatedOn ?p } GROUP BY ?p HAVING (COUNT(DISTINCT ?x) >= ${buildings}) }
      ?b a jgk:Building ; jgk:locatedOn ?p .
    } ORDER BY ?b

