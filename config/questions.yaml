- id: sub-entrance
  question: 주출입구가 아닌 출입구가 있는 건물
  source: q14
  answer: 주출입구가 아닌 출입구(공용, 보행자용, 차량용)는 {n}개입니다.
  columns: {e: 출입구, t: 유형, b: 건물}
  map_var: b
  count_var: e
  sparql: |
    SELECT ?e ?t ?b WHERE {
      ?e a jgk:BuildingEntrance ; jgk:entranceType ?t .
      ?b jgk:hasEntrance ?e .
      FILTER(?t != "주출입구")
    } ORDER BY ?t ?e ?b

- id: name-apartment
  question: 이름에 '아파트'가 들어간 건물
  source: q19
  answer: 이름에 '아파트'가 들어간 건물은 {n}동입니다.
  columns: {b: 건물, f: 지상 층수}
  map_var: b
  sparql: |
    SELECT DISTINCT ?b ?f WHERE {
      ?b a jgk:Building ; rdfs:label ?l .
      OPTIONAL { ?b jgk:floorsAbove ?f }
      FILTER(CONTAINS(STR(?l), "아파트"))
    } ORDER BY ?b

- id: yangcheon-ro
  question: 양천로를 주소로 쓰는 건물
  answer: 도로명주소의 길 이름이 정확히 양천로인 건물은 {n}동입니다. 양천로61길 같은 곁길은 따로 셉니다.
  columns: {b: 건물, use: 용도}
  map_var: b
  sparql: |
    SELECT DISTINCT ?b ?use WHERE {
      ?b a jgk:Building ; jgk:addressRoad ?r .
      ?r rdfs:label "양천로"@ko .
      OPTIONAL { ?b jgk:useName ?use }
    } ORDER BY ?b

- id: cafe-300
  question: 증미역 300m 안 카페가 있는 건물
  answer: 증미역 300m 안에 공공데이터에 등록된 카페가 {n}곳 있습니다 (상가정보 2026년 9월 기준).
  columns: {s: 상호, b: 들어 있는 건물}
  map_var: b
  count_var: s
  sparql: |
    SELECT ?s ?b WHERE {
      ?s a jgk:Business ; jgk:categorySmall "카페" ; jgk:inBuilding ?b ; geo:hasDefaultGeometry/geo:asWKT ?w .
      FILTER(geof:sfIntersects(?w, {{NEAR:https://yeodh10.github.io/jeungmi-geokg/id/station/1150010200106660040000001:300}}))
    } ORDER BY ?b ?s

- id: households-1000
  question: 세대수가 1,000세대 이상인 필지의 건물
  answer: 건축물대장 총괄표제부의 세대수가 1,000세대 이상인 필지는 {n}곳입니다.
  columns: {p: 필지, h: 세대수, b: 건물}
  map_var: b
  count_var: p
  sparql: |
    SELECT ?p ?h ?b WHERE {
      ?p a jgk:Parcel ; jgk:households ?h .
      ?b a jgk:Building ; jgk:locatedOn ?p .
      FILTER(?h >= 1000)
    } ORDER BY DESC(?h) ?p ?b
