- id: gayang-apartment
  question: 법정동 가양동의 공동주택 건물
  source: q04
  answer: 법정동 가양동에 용도가 공동주택인 건물이 {n}동 있습니다.
  columns: {b: 건물, f: 지상 층수}
  map_var: b
  sparql: |
    SELECT DISTINCT ?b ?f WHERE {
      ?b a jgk:Building ; jgk:useName "공동주택" ; jgk:inLegalDong ?d .
