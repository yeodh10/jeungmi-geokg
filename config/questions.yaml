  source: q03
  slots: {dong: 등촌동}
  answer: 법정동이 ${dong}인 건물 가운데 도로명주소가 없는 건물은 {n}동입니다.
  none: 법정동이 ${dong}인 건물 가운데 도로명주소가 없는 건물은 없습니다.
  columns: {b: 건물, use: 용도}
  map_var: b
  forms:
    - 법정동 ${dong}의 도로명주소 없는 건물
    - ${dong}에서 주소가 없는 건물
    - ${dong} 주소 미연결 건물은 몇 동이야
