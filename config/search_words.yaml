# 찾기 낱말 (명세 3.5절, 9절, 0-1절). src/graph/places.py가 places.json의 words로 브라우저에 보낸다.
# 화면 찾기 코드(web/app/search-core.js)에는 낱말을 적지 않고 이 파일 값만 쓴다.

# 같은 뜻의 다른 표기. 찾기말 전체가 왼쪽과 같으면 오른쪽으로도 찾는다.
aliases:
  등촌1동: 등촌제1동
  등촌2동: 등촌제2동
  등촌3동: 등촌제3동
  화곡6동: 화곡제6동
  가양2동: 가양제2동
  가양3동: 가양제3동
  증미: 증미역

# 끝 줄임말. 찾기말의 낱말이 이 글자로 끝나면 오른쪽을 붙여서도 찾는다 (백석초 -> 백석초등학교, 경서중 -> 경서중학교).
suffix_aliases:
  초: 초등학교
  중: 중학교
  고: 고등학교

# 주소에서 빼고 견주는 낱말 ('양천로 지하 560'과 '양천로 560'을 같게 본다)
drop_tokens: [지하, 번지]

# 이 지도에 없는 자료의 낱말. 결과가 없을 때 absent_note를 보여 준다.
# 카페, 약국, 은행은 0-1절 결정으로 뺐다 (상호 자료로 찾는다). 편의점도 상호 칩이 있어 넣지 않는다.
absent_words: [버스, 버스정류장, 정류장, 시간표, 출구, 영업시간, 리뷰, 평점, 별점, 맛집, 전화번호, 날씨, 교통, 혼잡, 길찾기, 도보]
absent_note: 이 지도에는 이 정보가 없습니다. 건물과 주소, 공공데이터에 등록된 상호만 다룹니다. 영업시간, 리뷰, 교통 정보는 없습니다.

# 결과가 있어도 실제 시설 수처럼 읽힐 수 있는 낱말. 결과 위에 partial_note를 붙인다.
partial_words: [병원, 의원, 마트, 주차, 공원]
partial_note: 공공데이터에 등록된 상호만 찾습니다. 이름에 이 낱말이 든 건물과 상호만 나오고, 빠진 곳이 있을 수 있습니다.

# 범위 밖 동네와 장소. 결과가 없을 때 outside_note를 보여 준다.
outside_words: [여의도, 강남, 홍대, 신촌, 합정, 당산, 영등포, 마곡, 발산, 김포공항, 상암, 일산, 부천, 잠실, 종로, 명동, 서울역]
outside_note: 이 지도는 증미역 반경 1km만 다룹니다.

# 그 밖에 결과가 없을 때
none_note: 맞는 장소를 찾지 못했습니다. 띄어쓰기와 철자를 확인하거나 '양천로 550', '등촌동 666-40'처럼 주소로 찾아 보세요.
