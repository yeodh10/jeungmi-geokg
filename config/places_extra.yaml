# 상가정보에 없어 사람이 직접 넣은 장소. src/model/build_business.py가 읽어 화면 자료(상호 찾기)에만 넣는다.
# 공식 번호(상가업소번호)가 없어 그래프 객체로 만들지 않는다. 새 번호를 지어내지 않기 위해서다 (docs/uri-policy.md).
# 넣는 조건: 누구나 볼 수 있는 공식 출처에 주소가 적혀 있고, 그 주소가 우리 그래프의 건물과 같을 때만.
# 호수, 사람 이름, 전화번호는 넣지 않는다. 업종은 출처가 정한 분류가 없으면 적지 않는다.
#
# 칸
#   name      출처에 적힌 이름
#   building  들어 있는 건물의 건물관리번호(25자리). 우리 그래프에 있어야 한다
#   address   출처에 적힌 주소 (호수는 뺀다)
#   source       출처 주소
#   source_name  출처를 사람이 읽는 이름
#   checked      출처를 확인한 날
- name: 지오스토리
  building: "1150010200106380003000001"  # 강서아이티밸리, 서울특별시 강서구 화곡로68길 82
  address: 서울특별시 강서구 화곡로68길 82 (등촌동, 강서IT밸리)
  source: http://geostory.co.kr
  source_name: 회사 누리집 바닥글
  checked: 2026-11-02
