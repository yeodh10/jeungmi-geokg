# 자료 탭 내용 (명세 3.8절, 0-1절). src/graph/appdata.py가 assets/data/sources.json으로 쓴다.
# 값은 docs/data-sources.md의 '한눈에 보기' 표와 맞춘다. 어휘의 데이터셋 이름에는 기준일이 없는 것이 있어 여기에 따로 적는다.
# 공개하지 않는 자료는 이름과 까닭만 적는다. 승인, 반려 건수 같은 대조 숫자는 공개 화면에 넣지 않는다.

basis: 건물 2026년 10월, 주소 2026년 9월 기준   # 지도 아래 기준 표기 (GIS건물통합정보 2026-10-06, 내비게이션용DB 2026년 9월분)

sources:
  - name: GIS건물통합정보 (서울)
    by: 국토교통부
    as_of: 2026-10-06
    public: true
    used_for: 건물 모양, 용도, 층수, 구조, 사용승인일
    license: 이용허락범위 제한 없음
    url: https://www.data.go.kr/data/15052097/fileData.do
  - name: 도로명주소 내비게이션용DB
    by: 행정안전부
    as_of: 2026년 9월분
    public: true
    used_for: 건물관리번호, 도로명주소, 출입구, 길, 행정동, 법정동, 우편구역(기초구역) 소속
    license: 이용허락범위 제한 없음
    url: https://www.data.go.kr/data/15050419/fileData.do
  - name: 서울시 건축물대장 총괄표제부
    by: 서울특별시
    as_of: 2026-10-28 받은 날
    public: true
    used_for: 단지 필지의 대지면적, 세대수
    license: 공공누리 제1유형 (출처표시)
    url: https://data.seoul.go.kr/dataList/OA-23051/S/1/datasetView.do
  - name: 서울시 도시데이터 센서(S-DoT) 환경정보
    by: 서울특별시
    as_of: 설치 위치 2026-03-11, 관측 2026-10-12~18
    public: true
    used_for: 센서 5대와 1시간 평균 관측값 (실시간 값이 아닙니다)
    license: 공공누리 제1유형 (출처표시)
    url: https://data.seoul.go.kr/dataList/OA-15969/S/1/datasetView.do
  - name: 소상공인시장진흥공단 상가(상권)정보 (서울)
    by: 소상공인시장진흥공단
    as_of: 2026년 9월 기준 (분기 갱신)
    public: true
    used_for: 상호 이름, 지점명, 업종, 층. 영업시간, 전화번호, 리뷰는 이 자료에 없습니다
    license: 이용허락범위 제한 없음
    url: https://www.data.go.kr/data/15083033/fileData.do
    note: 주택 건물 안 업체는 개인 집 주소일 수 있어, 1층이나 지하이면서 손님이 찾아오는 업종만 싣습니다.
  - name: 민원행정기관 전자지도
    by: 행정안전부
    as_of: 2024년 1월분
    public: false
    reason: 이용 목적 심사를 거쳐 받은 자료라서 공개하지 않기로 정했습니다. 공공시설은 이 저장소의 로컬 서버에서만 보입니다.
  - name: 도로명주소 전자지도 (서울)
    by: 행정안전부
    as_of: 2026년 9월분
    public: false
    reason: 이용 목적 심사를 거쳐 받은 자료라서 공개하지 않기로 정했습니다. 도로 구간과 법정동, 우편구역 경계 모양이 여기서 옵니다.
  - name: 국토지리정보원 수치지형도
    by: 국토지리정보원
    as_of: 2025년 제작
    public: false
    reason: 기본측량성과라서 공간정보관리법 제16조에 따라 해외 서버에 올리지 않습니다.
  - name: 국토지리정보원 국가기본도
    by: 국토지리정보원
    as_of: 2026-10-30 내려받기
    public: false
    reason: 기본측량성과라서 공간정보관리법 제16조에 따라 해외 서버에 올리지 않습니다.

# 이 지도에 없는 것 (명세 4.4절, 0-1절로 '입점 상호'를 뺐다)
absent: [영업시간, 리뷰, 평점, 전화번호, 사진, 버스와 지하철 시간표, 역 출구 번호, 교통과 혼잡 정보, 날씨, 실시간 값, 거리 사진,
         보행 경로, 소요 시간, 2019년 이후 사용승인일, 1km 밖 자료]

# 원칙 3 (0-1절로 바꾼 글)
principle: 건물과 주소 지도입니다. 상호는 공공데이터 기준이고 영업시간, 리뷰는 없습니다.

# 공개 범위 설명
scope: >-
  공개하지 않는 자료에서 온 장소와 모양은 이 사이트에 넣지 않았습니다. 출처를 알 수 없는 장소도 넣지 않고,
  승인한 변경은 근거 자료가 적혀 있고 모두 공개 자료일 때만 얹습니다.

# 공개 '기록' 탭을 두지 않는 까닭 (명세 3.8절)
history: 공개 사이트에는 변경 기록을 싣지 않았습니다. 지금까지의 변경은 공개하지 않는 자료를 근거로 해서 이 저장소의 로컬 서버에서만 볼 수 있습니다.

# 배경 지도 자료 표기 (web/vendor/base/ATTRIBUTION.txt와 같은 표기)
credits:
  - {name: OpenFreeMap, url: "https://openfreemap.org"}
  - {name: © OpenMapTiles, url: "https://www.openmaptiles.org/"}
  - {name: © OpenStreetMap 기여자, url: "https://www.openstreetmap.org/copyright"}
credits_note: 배경 지도 자료는 ODbL입니다. 건물, 주소, 상호는 위 공공데이터에서 왔습니다.
