# 대상 범위 설정
# 중심 좌표는 추측하지 않고 공식 데이터에서 확인한 값을 쓴다.

center:
  name: 증미역 (서울 9호선)
  # 출처: 도로명주소 내비게이션용DB 2026년 9월분, match_build_seoul.txt
  #   건물관리번호 1150010200106660040000001
  #   시군구용건물명 "증미역 9호선", 서울특별시 강서구 양천로 지하 560 (등촌동)
  #   건물중심점 좌표 (원본, EPSG:5179 GRS80 UTM-K)
  source: juso_navi_db/match_build_seoul.txt
  source_building_id: "1150010200106660040000001"
  source_crs: "EPSG:5179"
  source_xy: [943583.747211, 1951121.590532]
  # 아래 두 값은 위 원본 좌표를 pyproj로 변환한 결과다.
  epsg4326_lonlat: [126.8612468627311, 37.55771939318886]
  epsg5186_xy: [187740.13946078884, 550919.3081192819]

radius_m: 1000

# 역 객체로 만들 역사 건물. 이름과 번호는 내비게이션용DB에서 확인한 값이다.
stations:
  - name: 증미역
    line: 서울 지하철 9호선
    bldg_mgt_no: "1150010200106660040000001"

crs:
  storage: "EPSG:4326"   # 저장
  metric: "EPSG:5186"    # 거리 계산, 범위 자르기

# 공개 페이지(src.graph.publish)에서 뺄 출처 (docs/decisions.md 2026-10-30). 수치지형도와 국가기본도는 공간정보관리법의
# 국외 반출 제한 때문에 공개 저장소와 공개 사이트에 올리지 않고, 전자지도 2종은 공개 보류를 유지한다.
publish:
  hold_sources:
    - dataset-public-office   # 민원행정기관 전자지도: 공공누리 1유형, 이용목적 심사 뒤 제공. 공개 보류
    - dataset-juso-emap       # 도로명주소 전자지도: 공공누리 1유형, 이용목적 심사 뒤 제공. 공개 보류 (도로 구간 전체, 법정동과 기초구역의 모양)
    - dataset-ngii-digital-map  # 국토지리정보원 수치지형도: 기본측량성과, 공간정보관리법 제16조 때문에 해외 서버에 올리지 않는다 (수치지형도 건물 전체)
    - dataset-ngii-basemap      # 국토지리정보원 국가기본도: 기본측량성과, 공간정보관리법 제16조 때문에 해외 서버에 올리지 않는다 (국가기본도 건물 전체)
  # 상호(소상공인 상가정보)의 공개 규칙 (docs/decisions.md 2026-11-03). 주택 건물 안 업체는 개인 집 주소일 수 있어,
  # 아래 층과 대분류에 맞는 곳만 공개한다. 주택이 아닌 건물의 업체와 필지에만 이은 업체(그 필지에 주택이 없을 때)는 모두 공개한다.
  # 그래프(로컬)에는 모두 들어 있고, 공개 사이트(src.graph.publish)와 화면 자료(src.model.build_business)만 이 규칙으로 뺀다.
  business:
    home_uses: [단독주택, 공동주택, 주택]   # 건물 용도(useName) 원천 값
    open_floors: 1층과 지하               # 층정보가 '1'이거나 '지', 'B'와 숫자로 시작할 때 (src.model.build_business.open_floor)
    walk_in: [음식, 소매, 보건의료, 숙박, "수리, 개인", 교육, "예술, 스포츠"]  # 상권업종 대분류. 원천의 가운뎃점은 쉼표로 바꾼 값

# 범위에 걸치기만 해도 포함할지(intersects), 완전히 안에 있어야 하는지(within)
clip_rule:
  polygon: intersects
  point: within
